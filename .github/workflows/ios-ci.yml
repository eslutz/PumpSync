name: iOS CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "PumpSync/**"
      - "PumpSyncTests/**"
      - "PumpSyncUITests/**"
      - "project.yml"
      - ".swiftlint.yml"
      - "Scripts/tests/test-host-unit.sh"
      - "Scripts/validate-version.sh"
      - "Scripts/ios/validate-tests.sh"
      - "Scripts/ios/validate-cloud-tests.sh"
      - "ci_scripts/**"
      - "Scripts/tests/validate-version-tests.sh"
      - "Scripts/tests/validate-ci-workflow-tests.rb"
      - "Scripts/tests/validate-test-runner-tests.py"
      - "Scripts/tests/validate-test-allocation.py"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "PumpSync/**"
      - "PumpSyncTests/**"
      - "PumpSyncUITests/**"
      - "project.yml"
      - ".swiftlint.yml"
      - "Scripts/tests/test-host-unit.sh"
      - "Scripts/validate-version.sh"
      - "Scripts/ios/validate-tests.sh"
      - "Scripts/ios/validate-cloud-tests.sh"
      - "ci_scripts/**"
      - "Scripts/tests/validate-version-tests.sh"
      - "Scripts/tests/validate-ci-workflow-tests.rb"
      - "Scripts/tests/validate-test-runner-tests.py"
      - "Scripts/tests/validate-test-allocation.py"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  ios:
    name: Build, lint, test, and analyze iOS
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow shell syntax
        run: ruby Scripts/tests/validate-ci-workflow-tests.rb

      - name: Validate test runner arguments and failure handling
        run: |
          python3 Scripts/tests/validate-test-runner-tests.py
          python3 Scripts/tests/validate-test-allocation.py

      - name: Validate release version
        run: |
          Scripts/tests/validate-version-tests.sh
          Scripts/validate-version.sh

      - name: Select latest stable Xcode
        run: |
          developer_dir="$(python3 - <<'PYCODE'
          import glob, plistlib, re
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              if re.search(r"beta|RC", app, re.I):
                  continue
              with open(app + "/Contents/Info.plist", "rb") as stream:
                  version = plistlib.load(stream)["CFBundleShortVersionString"]
              parts = tuple(map(int, version.split(".")))
              candidates.append((parts, app + "/Contents/Developer"))
          if not candidates or max(candidates)[0] < (27, 2):
              raise SystemExit("Latest stable Xcode 27.2 or newer is required on this runner")
          print(max(candidates)[1])
          PYCODE
          )"
          sudo xcode-select --switch "$developer_dir"
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          set -euo pipefail
          # Match the generator used for the committed project and schemes.
          version=2.48.0
          archive="$RUNNER_TEMP/xcodegen.zip"
          curl --fail --silent --show-error --location \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$version/xcodegen.zip" \
            --output "$archive"
          echo "620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892  $archive" | shasum -a 256 -c
          unzip -q "$archive" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/xcodegen/bin/xcodegen" --version
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project is current
        run: git diff --exit-code -- PumpSync.xcodeproj

      - name: Lint Swift
        run: |
          brew install swiftlint
          swiftlint lint --strict --no-cache

      - name: Run simulator-free macOS unit tests
        run: bash Scripts/tests/test-host-unit.sh

      - name: Build and analyze iOS without signing
        run: |
          set -euo pipefail
          xcodebuild build analyze -project PumpSync.xcodeproj -scheme PumpSync \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath .DerivedData -jobs 2 CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/pumpsync-build.log"
          if grep -Ei '(^|[[:space:]])warning:' "$RUNNER_TEMP/pumpsync-build.log"; then
            exit 1
          fi

  security:
    name: Scan Swift for security issues
    runs-on: ubuntu-latest
    container: semgrep/semgrep:1.179.0
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep Swift rules
        run: semgrep scan --config p/swift --disable-version-check --metrics off --error PumpSync/Sources

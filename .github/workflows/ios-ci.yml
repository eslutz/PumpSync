name: iOS CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "PumpSync/**"
      - "PumpSyncTests/**"
      - "PumpSyncUITests/**"
      - "project.yml"
      - "Scripts/validate-version.sh"
      - "Scripts/ios/validate-tests.sh"
      - "Scripts/ios/validate-cloud-tests.sh"
      - "Scripts/ios/validate-session-contract.sh"
      - "Scripts/ios/prepare-session-contract.sh"
      - "Scripts/ios/update-session-contract-snapshots.sh"
      - "Scripts/tests/validate-session-contract-snapshots-tests.sh"
      - "ci_scripts/**"
      - "Scripts/tests/validate-version-tests.sh"
      - "Scripts/tests/validate-ci-workflow-tests.rb"
      - "Scripts/tests/validate-test-runner-tests.py"
      - "Scripts/tests/validate-test-allocation.py"
      - ".github/workflows/ios-ci.yml"
  pull_request:
    paths:
      - "PumpSync/**"
      - "PumpSyncTests/**"
      - "PumpSyncUITests/**"
      - "project.yml"
      - "Scripts/validate-version.sh"
      - "Scripts/ios/validate-tests.sh"
      - "Scripts/ios/validate-cloud-tests.sh"
      - "Scripts/ios/validate-session-contract.sh"
      - "Scripts/ios/prepare-session-contract.sh"
      - "Scripts/ios/update-session-contract-snapshots.sh"
      - "Scripts/tests/validate-session-contract-snapshots-tests.sh"
      - "ci_scripts/**"
      - "Scripts/tests/validate-version-tests.sh"
      - "Scripts/tests/validate-ci-workflow-tests.rb"
      - "Scripts/tests/validate-test-runner-tests.py"
      - "Scripts/tests/validate-test-allocation.py"
      - ".github/workflows/ios-ci.yml"

permissions:
  contents: read

jobs:
  ios:
    name: Generate, build, and test iOS
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate workflow shell syntax
        run: ruby Scripts/tests/validate-ci-workflow-tests.rb

      - name: Validate test runner arguments and failure handling
        run: |
          python3 Scripts/tests/validate-test-runner-tests.py
          python3 Scripts/tests/validate-test-allocation.py

      - name: Validate release version
        run: |
          Scripts/tests/validate-version-tests.sh
          Scripts/validate-version.sh

      - name: Validate committed contract snapshots
        run: bash Scripts/tests/validate-session-contract-snapshots-tests.sh

      - name: Select latest stable Xcode
        run: |
          developer_dir="$(python3 - <<'PYCODE'
          import glob, plistlib, re
          candidates = []
          for app in glob.glob("/Applications/Xcode*.app"):
              if re.search(r"beta|RC", app, re.I):
                  continue
              with open(app + "/Contents/Info.plist", "rb") as stream:
                  version = plistlib.load(stream)["CFBundleShortVersionString"]
              parts = tuple(map(int, version.split(".")))
              candidates.append((parts, app + "/Contents/Developer"))
          if not candidates or max(candidates)[0] < (27, 2):
              raise SystemExit("Latest stable Xcode 27.2 or newer is required on this runner")
          print(max(candidates)[1])
          PYCODE
          )"
          sudo xcode-select --switch "$developer_dir"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Verify generated Xcode project is current
        run: git diff --exit-code -- PumpSync.xcodeproj

      - name: Create simulator
        id: simulator
        run: |
          set -euo pipefail
          runtime="$(xcrun simctl list runtimes available --json | python3 -c '
          import json, re, sys
          runtimes = [
              runtime for runtime in json.load(sys.stdin)["runtimes"]
              if runtime.get("isAvailable") and runtime.get("identifier") == "com.apple.CoreSimulator.SimRuntime.iOS-27-0"
          ]
          if not runtimes:
              raise SystemExit("Required iOS 27.0 simulator runtime is unavailable")
          runtimes.sort(key=lambda runtime: [int(part) for part in re.findall(r"\d+", runtime.get("version", ""))])
          print(runtimes[-1]["identifier"])
          ')"
          device_type="$(xcrun simctl list devicetypes --json | python3 -c '
          import json, sys
          device_types = json.load(sys.stdin)["devicetypes"]
          by_identifier = {device_type["identifier"]: device_type for device_type in device_types}
          # Keep small-screen coverage for this project.
          preferred = [
              "com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-16-Pro",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15",
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro",
          ]
          for identifier in preferred:
              if identifier in by_identifier:
                  print(identifier)
                  break
          else:
              for device_type in device_types:
                  if "iPhone" in device_type.get("name", ""):
                      print(device_type["identifier"])
                      break
              else:
                  raise SystemExit("No iPhone simulator device types found")
          ')"
          device_id="$(xcrun simctl create PumpSync-CI "$device_type" "$runtime")"
          xcrun simctl boot "$device_id" || true
          xcrun simctl bootstatus "$device_id" -b
          echo "destination=platform=iOS Simulator,id=$device_id,arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Validate tests and reject warnings
        env:
          PUMPSYNC_TEST_DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: |
          bash Scripts/ios/validate-tests.sh -jobs 1 -parallel-testing-enabled NO -derivedDataPath .DerivedData
